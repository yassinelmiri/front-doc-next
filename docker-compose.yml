version: '3.8'

services:
  frontend:
    build: .
    container_name: docnoti-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://backend-docnotif.vercel.app
      - NEXT_PUBLIC_BACKEND_URL=https://backend-docnotif.vercel.app
    ports:
      - "3000:3000"
    networks:
      - frontend-network
    volumes:
      - /app/.next
      - /app/node_modules

networks:
  frontend-network:
    driver: bridge
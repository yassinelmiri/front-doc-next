version: '3.8'

services:
  frontend:
    build: .
    container_name: docnoti-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    ports:
      - "3000:3000"
    networks:
      - frontend-network
    volumes:
      - /app/.next
      - /app/node_modules

networks:
  frontend-network:
    driver: bridge